<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Applied before first paint so a returning visitor who picked
      // "legacy" never sees a flash of the new default style.
      try {
        if (localStorage.getItem('repcastr_visual_style') === 'legacy') {
          document.documentElement.setAttribute('data-style', 'legacy')
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repcastr — Discover companies, ranked by real votes</title>
    <meta
      name="description"
      content="Discover and compare companies across technology, business, automotive and more — ranked by real community votes, with transparent sponsored placement companies openly bid for."
    />
    <link rel="canonical" href="https://repcastr.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Repcastr" />
    <meta property="og:url" content="https://repcastr.com/" />
    <meta property="og:title" content="Repcastr — Discover companies, ranked by real votes" />
    <meta
      property="og:description"
      content="Discover and compare companies across technology, business, automotive and more — ranked by real community votes, with transparent sponsored placement."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Repcastr — Discover companies, ranked by real votes" />
    <meta
      name="twitter:description"
      content="Discover and compare companies across technology, business, automotive and more — ranked by real community votes, with transparent sponsored placement."
    />
  </head>
  <body>
    <div id="root"></div>
    <footer style="padding: 16px; text-align: center; font: 12px/1.4 system-ui, sans-serif; color: #888;">
      Repcastr — Nuno Daniel Oliveira Marques
    </footer>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
